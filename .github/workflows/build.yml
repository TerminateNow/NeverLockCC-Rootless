name: Build

on:
  push:
    branches: [claude-dev]
  workflow_dispatch:

jobs:
  build:
    # macOS/Xcode is needed for the new arm64e ABI that iOS 14+ requires.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --depth 1 --recursive --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set --no-cone '/iPhoneOS15.6.sdk'
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" "$HOME/theos/sdks/"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: neverlockcc-deb
          path: packages/*.deb
